<section>
  <ssg-kpi
    matTooltip="Stardate"
    icon="event"
    [value]="turn | async"
    [decimals]="1"
  ></ssg-kpi>
  <span class="spacer"></span>
  <div class="kpis">
    <ssg-kpi
      (click)="taxDialog()"
      matTooltip="Treasury"
      icon="savings"
      [value]="treasury | async"
    ></ssg-kpi>
    <ssg-kpi
      matTooltip="Command points"
      icon="join_inner"
      [value]="6"
      [disabled]="true"
    ></ssg-kpi>
    <ssg-kpi
      matTooltip="Food"
      icon="dinner_dining"
      [value]="20"
      [disabled]="true"
    ></ssg-kpi>
    <ssg-kpi
      matTooltip="Freighters"
      icon="local_shipping"
      [value]="0"
      [disabled]="true"
    ></ssg-kpi>
    <ssg-kpi
      matTooltip="Research points"
      icon="biotech"
      [value]="12"
      [disabled]="true"
    ></ssg-kpi>
  </div>
  <span class="spacer"></span>
  <button (click)="endTurn()" color="primary" mat-button>TURN</button>
</section>
