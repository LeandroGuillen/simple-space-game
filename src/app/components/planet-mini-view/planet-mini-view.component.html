<mat-card>
	<mat-card-header>
		<div mat-card-avatar></div>
		<mat-card-title>{{planet.name}}</mat-card-title>
		<mat-card-subtitle>{{shortDescription}}</mat-card-subtitle>
	</mat-card-header>


	<mat-card-content>
		<p>Population: {{planet.current_pop}}/{{planet.max_pop}} (+{{planet.pop_growth}})</p>

	</mat-card-content>
	<mat-card-actions>
		<!-- <button mat-button>LIKE</button>
			<button mat-button>SHARE</button> -->
	</mat-card-actions>
	<crn-planet-icon mat-card-image [planet]="planet"></crn-planet-icon>
</mat-card>
