<mat-toolbar color="primary">
  <button [matMenuTriggerFor]="menu" mat-icon-button>
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <button mat-menu-item routerLink="/server">Servers...</button>
  </mat-menu>

  <span>Master of Rigel</span>
  <span class="spacer"></span>
  <button mat-button routerLink="/stars">STARS</button>
  <button mat-button routerLink="/colonies">COLONIES</button>

  <span class="spacer"></span>

  <span><small>current game:</small> {{gameID | async}}</span>
  <button mat-button routerLink="/game">CHANGE</button>
</mat-toolbar>

<mat-toolbar>
  <crn-kpi icon="savings" [value]="treasury | async"></crn-kpi>
  <span class="spacer"></span>
  <button (click)="turn()" color="primary" mat-flat-button>TURN</button>
</mat-toolbar>
