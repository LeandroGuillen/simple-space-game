<h1 mat-dialog-title>New Game</h1>
<div mat-dialog-content>

  <form [formGroup]="form">

    <div class="col">
      <mat-form-field appearance="fill">
        <mat-label>Player name</mat-label>
        <input formControlName="playerName" matInput required type="text">
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Race</mat-label>
        <input disabled matInput type="text">
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Tech level</mat-label>
        <input disabled matInput type="text">
      </mat-form-field>
    </div>

    <div class="col">
      <mat-form-field appearance="fill">
        <mat-label>Galaxy size</mat-label>
        <mat-select formControlName="numStars" required>
          <mat-option *ngFor="let gs of galaxySizes" [disabled]="gs.disabled" [value]="gs.value">
            {{gs.label}}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Galaxy age</mat-label>
        <input disabled matInput type="text">
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Number of AI players</mat-label>
        <input disabled matInput type="text">
      </mat-form-field>

      <mat-slide-toggle disabled>Tactical combat</mat-slide-toggle>
      <mat-slide-toggle disabled>Random events</mat-slide-toggle>
      <mat-slide-toggle disabled>Antarans attack</mat-slide-toggle>
    </div>
  </form>
</div>

<div mat-dialog-actions>
  <button (click)="newGame()" mat-raised-button>New Game</button>
  <button (click)="cancel()" mat-button>Cancel</button>
</div>
