<button (click)="openNewServerDialog()" color="primary" mat-mini-fab>
  <mat-icon>add</mat-icon>
</button>

<h2>Server List</h2>
<small *ngIf="!numServers">There are no servers, add one to get started.</small>
<mat-list>
  <mat-list-item *ngFor="let s of servers | async">
    <h3 matLine>{{s.name}}</h3>
    <p matLine>
      <ssg-server-status-icon [status]="false"></ssg-server-status-icon>
      <span>{{s.url}} </span>
      <strong>({{s.id.split('-')[0]}})</strong>
    </p>

    <div class="item-buttons">
      <button (click)="connect(s)" color="primary" mat-mini-fab>
        <mat-icon>play_arrow</mat-icon>
      </button>
      <button (click)="removeServer(s)" color="accent" mat-mini-fab>
        <mat-icon>delete</mat-icon>
      </button>
    </div>
    <mat-divider></mat-divider>
  </mat-list-item>

</mat-list>
