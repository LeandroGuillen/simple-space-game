<table
  [dataSource]="dataSource"
  class="mat-elevation-z8"
  id="fleetTable"
  mat-table
  matSort
  multiTemplateDataRows
>
  <ng-container *ngFor="let c of columns" [matColumnDef]="c.key">
    <th *matHeaderCellDef mat-header-cell mat-sort-header>{{ c.name }}</th>
    <td *matCellDef="let d" mat-cell>{{ d[c.key] }}</td>
  </ng-container>

  <tr *matHeaderRowDef="displayedColumns" mat-header-row></tr>
  <tr
    (click)="selectRow(row)"
    *matRowDef="let row; columns: displayedColumns"
    class="ship-design-row"
    mat-row
  ></tr>
</table>

<section id="controls">
  <button (click)="newDesign()" color="primary" mat-stroked-button>New Design</button>
</section>
