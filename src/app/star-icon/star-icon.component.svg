<svg

  xmlns="http://www.w3.org/2000/svg">

  <filter id="blur">
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.7"/>
  </filter>

  <rect height="20" width="20"/>

  <g [attr.transform]="'translate(10 10)'">
 
    <circle [attr.fill]="colors[color]" [attr.r]="5"
            filter="url(#blur)"/>
    <circle [attr.fill]="colors[color]" [attr.r]="3"/>
    <circle [attr.fill]="'white'" [attr.r]="2"/>

    <circle [attr.r]="6" class="hovering-star" fill-opacity="0" stroke="darkgoldenrod" stroke-opacity="0"
            stroke-width="2"/>
  </g>
</svg>
