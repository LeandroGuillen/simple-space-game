<mat-toolbar color="primary">
  <button [matMenuTriggerFor]="menu" mat-icon-button>
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <button mat-menu-item routerLink="/server">Server management...</button>
    <button mat-menu-item routerLink="/game">Game management...</button>
  </mat-menu>

  <span>Master of Rigel</span>
  <span class="spacer"></span>
  <button mat-button routerLink="/stars">STARS</button>
  <button mat-button routerLink="/colonies">COLONIES</button>

  <span class="spacer"></span>

  <span>{{gameID | async}}</span>
</mat-toolbar>

<mat-toolbar>
  <span class="spacer"></span>
  <span>Treasury: {{treasury | async}}</span>
  <button (click)="turn()" color="primary" mat-flat-button>TURN</button>
</mat-toolbar>
