<crn-galaxy-view *ngIf="galaxy" [galaxy]="galaxy"></crn-galaxy-view>
<table *ngIf="galaxy">
  <tr>
    <th>Name</th>
    <th>Position</th>
    <th>Color</th>
    <th>Number of Planets</th>
  </tr>

  <tr *ngFor="let s of galaxy?.stars">
    <td><a routerLink="/stars/{{s.id}}">{{s.name}}</a></td>
    <td>({{s.x}}, {{s.y}})</td>
    <td>{{s.color}}</td>
    <td>{{s.planets.length}}</td>
  </tr>
</table>
