<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SSG AI Manager</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>AI Manager</h1>
    <span id="connection" class="conn">connecting…</span>
  </header>
  <main>
    <aside id="sidebar">
      <div class="sidebar-head">
        <button id="add-agent">+ Add agent</button>
      </div>
      <ul id="agent-list"></ul>
    </aside>
    <section id="detail">
      <div class="empty">Select or add an agent.</div>
    </section>
  </main>

  <dialog id="add-dialog">
    <form method="dialog" id="add-form">
      <h2>Add agent</h2>
      <label>Server URL
        <input name="server" id="form-server" required />
      </label>
      <label>Game
        <select name="game" id="form-game" required></select>
      </label>
      <label>Player
        <select name="player" id="form-player" required></select>
      </label>
      <div class="dialog-buttons">
        <button type="button" id="add-cancel">Cancel</button>
        <button type="submit" id="add-submit">Add</button>
      </div>
      <p id="add-error" class="error"></p>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
