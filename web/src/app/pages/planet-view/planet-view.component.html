<button (click)="goBack()" mat-raised-button>BACK</button>

<div class="planet-info" *ngIf="planet">
  <h1>{{planet.name}}</h1>
  <p><small>{{description}}</small></p>

  <pre>
    Pop: {{planet.current_pop}}/{{planet.max_pop}}
    Growth: {{planet.pop_growth}}
  </pre>
</div>

<div class="population-control">
  <h2>Farmers ({{farmers.length}})</h2>

  <div cdkDropList #farmerList="cdkDropList" [cdkDropListData]="farmers" cdkDropListOrientation="horizontal"
    [cdkDropListConnectedTo]="[workerList, scientistList]" class="colonist-list" (cdkDropListDropped)="drop($event)">
    <img src="assets/icons/shovel-24.png" alt="" class="colonist" *ngFor="let item of farmers" cdkDrag>
    <img *cdkDragPreview src="assets/icons/hammer-24.png">
  </div>

  <h2>Workers ({{workers.length}})</h2>

  <div cdkDropList #workerList="cdkDropList" [cdkDropListData]="workers"
    [cdkDropListConnectedTo]="[farmerList, scientistList]" class="colonist-list" (cdkDropListDropped)="drop($event)">
    <img src="assets/icons/hammer-24.png" alt="" class="colonist" *ngFor="let item of workers" cdkDrag>
    <img *cdkDragPreview src="assets/icons/hammer-24.png">
  </div>

  <h2>Scientists ({{scientists.length}})</h2>

  <div cdkDropList #scientistList="cdkDropList" [cdkDropListData]="scientists"
    [cdkDropListConnectedTo]="[farmerList, workerList]" class="colonist-list" (cdkDropListDropped)="drop($event)">
    <img src="assets/icons/microscope-24.png" alt="" class="colonist" *ngFor="let item of scientists" cdkDrag>
    <img *cdkDragPreview src="assets/icons/hammer-24.png">
  </div>

</div>

<div class="buildings" *ngIf="planet">
  <ssg-building-icon *ngFor="let b of planet.buildings" [building]="b"></ssg-building-icon>
</div>


<mat-accordion>
  <mat-expansion-panel [expanded]="true">
    <mat-expansion-panel-header>
      <mat-panel-title>Planet debug info</mat-panel-title>
    </mat-expansion-panel-header>
    <pre class="debug">{{ planet | json}}</pre>
  </mat-expansion-panel>
</mat-accordion>
