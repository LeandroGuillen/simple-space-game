<h1 mat-dialog-title>New Server</h1>
<div mat-dialog-content>

  <form [formGroup]="form">

    <div class="col">
      <mat-form-field appearance="fill">
        <mat-label>Name</mat-label>
        <input formControlName="name" matInput required type="text">
        <mat-error *ngIf="form.controls.name.hasError('duplicateServerName')">
          Server with that name already exists!
        </mat-error>
        <mat-error *ngIf="form.controls.name.hasError('required')">
          This field is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>URL</mat-label>
        <input formControlName="url" matInput required type="text">
        <mat-error *ngIf="form.controls.url.hasError('required')">
          This field is required
        </mat-error>
      </mat-form-field>
    </div>
  </form>
</div>

<div mat-dialog-actions>
  <button (click)="newServer()" mat-raised-button>Create</button>
  <button (click)="cancel()" mat-button>Cancel</button>
</div>
