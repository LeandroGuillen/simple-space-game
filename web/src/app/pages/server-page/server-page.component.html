<button (click)="openNewServerDialog()" color="primary" mat-mini-fab>
  <mat-icon>add</mat-icon>
</button>

<h2>Server List</h2>
<small *ngIf="!numServers">There are no servers, add one to get started.</small>

<div class="server-list">
  <ssg-server-list-item *ngFor="let s of servers | async" [server]="s" [status]="false" (connect)="connect($event)"
    (remove)="removeServer($event)">
  </ssg-server-list-item>
</div>
