<button (click)="goBack()" mat-raised-button>BACK</button>

<section>
  <div class="planet-list">
    <ssg-rich-select *ngFor="let p of planets" [planet]="p" (click)="clicked(p)" [selected]="p.id === selectedPlanetID">
    </ssg-rich-select>
  </div>

  <div class="planet-card">
    <ssg-planet-mini-view *ngIf="selectedPlanet" [planet]=selectedPlanet></ssg-planet-mini-view>
  </div>
</section>
