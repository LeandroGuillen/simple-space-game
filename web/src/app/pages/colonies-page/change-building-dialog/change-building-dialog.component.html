<h1 mat-dialog-title>Select building</h1>
<div mat-dialog-content>

  <form [formGroup]="form">
    <mat-form-field appearance="fill">
      <mat-label>Building</mat-label>
      <mat-select formControlName="selectedBuilding" required>
        <mat-option *ngFor="let b of availableBuildings; index as i" [value]="i+1">
          {{b}}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</div>

<div mat-dialog-actions>
  <button (click)="ok()" mat-raised-button>OK</button>
  <button (click)="cancel()" mat-button>Cancel</button>
</div>
