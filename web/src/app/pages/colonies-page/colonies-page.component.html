<h1>Colonies</h1>

<table [dataSource]="dataSource" class="mat-elevation-z8" mat-table matSort>
  <ng-container matColumnDef="id">
    <th *matHeaderCellDef mat-header-cell mat-sort-header>ID</th>
    <td *matCellDef="let planet" mat-cell>{{ planet.id }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th *matHeaderCellDef mat-header-cell mat-sort-header>Name</th>
    <td *matCellDef="let planet" mat-cell>
      <a routerLink="/stars/{{ planet.parent_star }}/planets/{{ planet.id }}">{{
        planet.name
        }}</a>
    </td>
  </ng-container>

  <ng-container matColumnDef="farmers">
    <th *matHeaderCellDef mat-header-cell mat-sort-header>Farmers</th>
    <td *matCellDef="let planet" mat-cell>{{ planet.farmers }}</td>
  </ng-container>

  <ng-container matColumnDef="workers">
    <th *matHeaderCellDef mat-header-cell mat-sort-header>Workers</th>
    <td *matCellDef="let planet" mat-cell>{{ planet.workers }}</td>
  </ng-container>

  <ng-container matColumnDef="scientists">
    <th *matHeaderCellDef mat-header-cell mat-sort-header>Scientists</th>
    <td *matCellDef="let planet" mat-cell>{{ planet.scientists }}</td>
  </ng-container>

  <ng-container matColumnDef="current_project">
    <th *matHeaderCellDef mat-header-cell mat-sort-header>Building</th>
    <td *matCellDef="let planet" mat-cell>{{ planet.current_project.name }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th *matHeaderCellDef mat-header-cell mat-sort-header>Actions</th>
    <td *matCellDef="let planet" mat-cell>
      <button (click)="changeBuilding(planet)" mat-icon-button>
        <mat-icon>room_preferences</mat-icon>
      </button>
      <button mat-icon-button>
        <mat-icon>shopping_cart</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr *matHeaderRowDef="displayedColumns" mat-header-row></tr>
  <tr *matRowDef="let row; columns: displayedColumns" mat-row></tr>
</table>
