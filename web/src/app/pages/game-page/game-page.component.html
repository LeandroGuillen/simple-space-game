<h1>{{ serverName | async }}</h1>

<button (click)="openNewGameDialog()" color="primary" mat-mini-fab>
  <mat-icon>add</mat-icon>
</button>

<h2>Game List</h2>

<small *ngIf="!numGames">
  No games in this server, create one to get started.
</small>

<mat-list>
  <mat-list-item *ngFor="let game of gameList | async">
    <div
      matLine
      class="game-line"
      [ngClass]="{ currentGame: currentGameID === game.game_id }"
    >
      <span>{{ game.game_id.substring(0, 8) }}</span>
      <span *ngIf="game.game_id === currentGameID">
        Stardate: {{ turn | async | number: '1.1-1' }}
      </span>
      <span *ngIf="game.game_id !== currentGameID">
        Stardate: {{ game.current_turn | number: '1.1-1' }}
      </span>
      <span class="star-count" matTooltip="Star count">
        {{ game.num_stars }} <mat-icon>star</mat-icon>
      </span>
    </div>

    <div class="item-buttons">
      <button
        [disabled]="currentGameID === game.game_id"
        (click)="startGame(game.game_id)"
        mat-stroked-button
      >
        PLAY
      </button>
      <button [disabled]="currentGameID !== game.game_id" mat-stroked-button>
        STOP
      </button>
    </div>
    <mat-divider></mat-divider>
  </mat-list-item>
</mat-list>
